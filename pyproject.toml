[project]
name = "llm-bias"
version = "0.1.0"
description = "Concept-cone steering experiments on decoder LLM investment decisions"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "huggingface-hub>=1.24.0",
    "jlens",
    "matplotlib>=3.11.1",
    "numpy>=2.5.1",
    "pytest>=9.1.1",
    "torch==2.9.1",
    "transformers>=5.14.1",
    "scipy>=1.18.0",
    "accelerate>=1.10.1",
    "seaborn>=0.13.2",
    "kernels>=0.15.2,<0.16.0",
]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["llm_bias*"]

[tool.uv.workspace]
members = [
    "third_party/jacobian-lens",
]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
jlens = { workspace = true, editable = true }
torch = { index = "pytorch" }

[tool.pytest.ini_options]
testpaths = ["tests"]
