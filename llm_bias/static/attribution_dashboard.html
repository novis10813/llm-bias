<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Generated-token Semantic Scope</title>
  <style>
    :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    body { margin: 0; color: #172033; background: #f4f6fa; }
    header { padding: 22px 28px 16px; background: #172033; color: #fff; }
    header h1 { margin: 0 0 8px; font-size: 22px; }
    header p { margin: 0; color: #c9d2e4; font-size: 13px; }
    main { padding: 20px 24px 36px; }
    .controls { display: flex; gap: 14px; align-items: center; margin-bottom: 18px; }
    select { font: inherit; padding: 7px 10px; border: 1px solid #bbc5d6; border-radius: 6px; background: #fff; }
    .legend { font-size: 12px; color: #556176; }
    .panels { display: grid; grid-template-columns: repeat(2, minmax(480px, 1fr)); gap: 16px; }
    .panel { min-width: 0; background: #fff; border: 1px solid #dbe1eb; border-radius: 8px; padding: 12px; box-shadow: 0 2px 8px #17203312; }
    .panel h2 { margin: 0 0 7px; font-size: 14px; }
    .panel-subtitle { color: #69758a; font-size: 11px; margin-bottom: 10px; }
    .validation-summary { margin: -3px 0 10px; color: #53627a; font: 11px/1.35 ui-monospace, SFMono-Regular, monospace; }
    .prompt-text { margin: 0 0 12px; color: #4c5870; font: 11px/1.45 ui-monospace, SFMono-Regular, monospace; white-space: pre-wrap; max-height: 72px; overflow: auto; }
    .flow { padding: 5px 2px 12px; border-top: 1px solid #e4e8f0; }
    .flow-line { display: flex; align-items: flex-start; gap: 8px; margin-top: 8px; }
    .output-line { overflow: visible; }
    .input-line { overflow: visible; padding-bottom: 8px; }
    .flow-label { flex: 0 0 58px; padding-top: 5px; color: #647089; font-size: 10px; font-weight: 700; text-transform: uppercase; }
    .token-track { display: flex; align-items: stretch; gap: 2px; }
    .output-line .token-track { flex-wrap: wrap; min-width: 0; }
    .input-line .token-track { flex: 1 1 auto; min-width: 0; max-width: 100%; flex-wrap: wrap; }
    .token { flex: 0 0 auto; min-width: 18px; max-width: 135px; padding: 4px 5px; border: 1px solid #d4dbe7; border-radius: 4px; color: #172033; font: 11px/1.2 ui-monospace, SFMono-Regular, monospace; white-space: pre-wrap; overflow-wrap: anywhere; text-align: left; cursor: pointer; transition: opacity .12s, background-color .12s, outline .12s; }
    .output-token { min-height: 29px; background: #e5eaf3; }
    .input-token { min-height: 28px; }
    .token:hover, .focused { outline: 2px solid #172033; outline-offset: 1px; }
    .muted { opacity: .15; }
    .input-token.zero { background: #f7f8fb; color: #8b95a8; }
    .hint { margin-top: 6px; color: #7a8598; font-size: 10px; }
    .tooltip { position: fixed; z-index: 5; pointer-events: none; display: none; max-width: 360px; padding: 8px 10px; background: #172033; color: #fff; border-radius: 5px; font-size: 12px; line-height: 1.4; box-shadow: 0 4px 14px #17203355; }
    @media (max-width: 900px) { .panels { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <h1>Generated-token Semantic Scope</h1>
    <p>Hover a Qwen output token to color the complete prompt by its target-logit influence.</p>
  </header>
  <main>
    <div class="controls">
      <label for="date-select">Date</label>
      <select id="date-select"></select>
      <span class="legend">Darker input tokens have larger Semantic Scope influence for the selected output token.</span>
    </div>
    <section id="panels" class="panels"></section>
  </main>
  <div id="tooltip" class="tooltip"></div>
  <script>window.ATTRIBUTION_DATA = __ATTRIBUTION_DATA__;</script>
  <script>__ATTRIBUTION_SCRIPT__</script>
</body>
</html>
